# Single-node Apache Pulsar for development and small on-prem installs.
# For production, use the Apache Pulsar Helm chart (ZooKeeper/Oxia, BookKeeper, brokers, proxies)
# or a managed Pulsar service, and set PULSAR_WS_URL in config.yaml to its WebSocket endpoint.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pulsar
  namespace: yatra-pulse
  labels: { app.kubernetes.io/name: pulsar, app.kubernetes.io/part-of: yatra-pulse }
spec:
  serviceName: pulsar
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: pulsar }
  template:
    metadata:
      labels: { app.kubernetes.io/name: pulsar, app.kubernetes.io/part-of: yatra-pulse }
    spec:
      containers:
        - name: pulsar
          image: apachepulsar/pulsar:4.2.4
          command: ["bin/pulsar", "standalone", "--no-functions-worker", "--no-stream-storage"]
          env:
            - { name: PULSAR_MEM, value: "-Xms512m -Xmx1g -XX:MaxDirectMemorySize=512m" }
            - { name: PULSAR_PREFIX_webSocketServiceEnabled, value: "true" }
          ports:
            - { name: pulsar, containerPort: 6650 }
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /admin/v2/clusters, port: http }
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            tcpSocket: { port: pulsar }
            initialDelaySeconds: 90
            periodSeconds: 20
          resources:
            requests: { cpu: 250m, memory: 1Gi }
            limits: { memory: 2Gi }
          volumeMounts:
            - { name: data, mountPath: /pulsar/data }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 5Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: pulsar
  namespace: yatra-pulse
  labels: { app.kubernetes.io/name: pulsar }
spec:
  selector: { app.kubernetes.io/name: pulsar }
  ports:
    - { name: pulsar, port: 6650, targetPort: pulsar }
    - { name: http, port: 8080, targetPort: http }
