<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yatra Pulse Operations</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Mukta:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Ops dashboard served by ops/metrics-consumer.js. Summary tiles, then SLOs, tools and the latest evaluator run. */
:root { --bg:#140F1F; --surface:#1D1630; --ink:#F1ECF8; --muted:#A99FBE; --line:#312849; --gold:#F2B544; --bad:#F0607A; --ok:#4CC38A; --warn:#E5C46A;
  --f-display:"Yatra One",Georgia,serif; --f-body:"Mukta",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,monospace; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 40px; display: grid; gap: 22px; }
.bulbs { height: 10px; background-image: radial-gradient(circle, var(--gold) 0 3px, transparent 3.5px); background-size: 18px 10px; }
header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 10px; }
h1 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 2rem; } h1 span { color: var(--gold); }
h2 { margin: 0 0 8px; font-size: 1rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 2px; }
.tile b { font-family: var(--f-mono); font-size: 1.5rem; color: var(--gold); }
.tile small { color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .92rem; }
th { text-align: left; color: var(--muted); font-size: .74rem; text-transform: uppercase; letter-spacing: .08em; padding: 0 10px 6px 0; }
td { padding: 7px 10px 7px 0; border-top: 1px solid var(--line); }
.pill { display: inline-block; font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; }
.ok { color: var(--ok); } .breach, .fail { color: var(--bad); } .no_data { color: var(--muted); } .warn { color: var(--warn); }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; } @media (max-width: 820px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
#err { color: var(--bad); }
</style>
</head>
<body>
<div class="bulbs" aria-hidden="true"></div>
<div class="wrap">
  <header>
    <div><h1>Yatra <span>Pulse</span> operations</h1><div class="mono" id="sub" style="color:var(--muted)">Connecting…</div></div>
    <div class="mono" id="pulsar"></div>
  </header>
  <p id="err" role="status"></p>
  <section class="tiles" id="tiles" aria-label="Summary"></section>
  <section class="panel"><h2>Service level objectives</h2><table><thead><tr><th>Objective</th><th>Target</th><th>Now</th><th>Status</th></tr></thead><tbody id="slos"></tbody></table></section>
  <div class="grid2">
    <section class="panel"><h2>MCP tools</h2><table><thead><tr><th>Tool</th><th>OK</th><th>Errors</th><th>Avg</th><th>p95 bucket</th></tr></thead><tbody id="tools"></tbody></table></section>
    <section class="panel"><h2>Latest evaluator run</h2><div id="eval" class="mono">No evaluator run received yet. Run <b>node eval/run.js</b>.</div></section>
  </div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pct = (n, d) => (d ? `${((n / d) * 100).toFixed(1)}%` : "–");
async function tick() {
  try {
    const s = await (await fetch("stats", { cache: "no-store" })).json();
    $("err").textContent = "";
    $("sub").textContent = `Window: last ${s.window_min} min · up ${Math.round(s.uptime_s / 60)} min · refreshed ${new Date().toLocaleTimeString()}`;
    $("pulsar").innerHTML = `<span class="pill ${s.pulsar.connected ? "ok" : "fail"}">Pulsar ${s.pulsar.connected ? "connected" : "disconnected"}</span> ${s.pulsar.received} msgs${s.pulsar.last_message_age_s !== null ? ` · last ${s.pulsar.last_message_age_s}s ago` : ""}`;
    const w = s.window, t = s.totals;
    $("tiles").innerHTML = [
      [w.calls, "tool calls (window)"], [pct(w.errors, w.calls), "error rate"], [`${w.p95_ms} ms`, "p95 latency"],
      [pct(w.zero_results, w.searches), "searches with no result"], [t.itinerary_checks, "itinerary checks"], [t.clashes, "clashes caught"],
    ].map(([v, l]) => `<div class="tile"><b>${esc(v)}</b><small>${esc(l)}</small></div>`).join("");
    $("slos").innerHTML = s.slos.map((x) => `<tr><td>${esc(x.label)}</td><td class="mono">${esc(x.target)}</td><td class="mono">${esc(x.value)}</td><td><span class="pill ${x.status}">${x.status.replace("_", " ")}</span></td></tr>`).join("");
    $("tools").innerHTML = Object.entries(s.tools).map(([k, v]) => `<tr><td class="mono">${esc(k)}</td><td>${v.ok}</td><td class="${v.error ? "fail" : ""}">${v.error}</td><td class="mono">${v.avg_ms ?? "–"} ms</td><td class="mono">≤ ${esc(v.p95_bucket_ms)} ms</td></tr>`).join("") || `<tr><td colspan="5">No tool calls yet.</td></tr>`;
    if (s.eval) $("eval").innerHTML = `<p><span class="pill ${s.eval.passed ? "ok" : "fail"}">${s.eval.passed ? "pass" : "fail"}</span> ${esc(new Date(s.eval.ts).toLocaleString())}${s.eval.git ? ` · ${esc(s.eval.git)}` : ""}</p>
      <table><tbody>${Object.entries(s.eval.metrics).map(([k, v]) => `<tr><td>${esc(k)}</td><td>${typeof v === "number" ? v.toFixed(3) : esc(v)}</td></tr>`).join("")}</tbody></table>
      ${s.eval.failures?.length ? `<p class="fail">${s.eval.failures.map(esc).join("<br>")}</p>` : ""}`;
  } catch (e) { $("err").textContent = "Can't reach the metrics consumer. Is it running?"; }
}
tick(); setInterval(tick, 5000);
</script>
</body>
</html>
